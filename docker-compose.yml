# Local development services.
# - platform: the Store Ops platform database (users, stores, policies, traces).
# - boutique: stands in for the boutique's Supabase Postgres, used by the Supabase adapter and its tests.
# - redis: job queues (Phase 6).
services:
  platform-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storeops
      POSTGRES_PASSWORD: storeops
      POSTGRES_DB: storeops
    ports:
      - "5433:5432"
    volumes:
      - platform-data:/var/lib/postgresql/data
      - ./docker/platform-init.sql:/docker-entrypoint-initdb.d/platform-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeops"]
      interval: 2s
      retries: 30

  boutique-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: boutique
      POSTGRES_DB: boutique
    ports:
      - "5434:5432"
    volumes:
      - boutique-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boutique"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  # ---- WooCommerce test store (optional): docker compose --profile woo up -d ----
  woo-db:
    profiles: [woo]
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - woo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  woo:
    profiles: [woo]
    image: wordpress:php8.3-apache
    depends_on:
      woo-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "8080:80"
    extra_hosts:
      # Lets WooCommerce deliver webhooks to the dashboard on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - woo-html:/var/www/html

  # One-off setup and seeding: docker compose --profile woo run --rm woo-cli <script>
  woo-cli:
    profiles: [woo]
    image: wordpress:cli-php8.3
    depends_on:
      - woo
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    volumes:
      - woo-html:/var/www/html
      - ./docker/woo:/scripts:ro

volumes:
  platform-data:
  boutique-data:
  woo-db-data:
  woo-html:
