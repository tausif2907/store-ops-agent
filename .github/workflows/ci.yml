name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      platform-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storeops
          POSTGRES_PASSWORD: storeops
          POSTGRES_DB: storeops
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U storeops" --health-interval 2s --health-retries 30
      boutique-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boutique
          POSTGRES_PASSWORD: boutique
          POSTGRES_DB: boutique
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U boutique" --health-interval 2s --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Write .env
        run: |
          cp .env.example .env
          sed -i "s#^CREDENTIALS_ENCRYPTION_KEY=\"\"#CREDENTIALS_ENCRYPTION_KEY=\"$(openssl rand -base64 32)\"#" .env
          sed -i "s#^SESSION_SECRET=\"\"#SESSION_SECRET=\"$(openssl rand -hex 32)\"#" .env

      - name: Create app role
        run: PGPASSWORD=storeops psql -h localhost -p 5433 -U storeops -d storeops -f docker/platform-init.sql

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      # Includes the tenant-isolation suite (zero leaks) and adapter conformance (100%).
      - run: pnpm test
      - run: pnpm --filter @store-ops/web build
